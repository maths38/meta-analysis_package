[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "meta-analysis"
version = "1.2"
description = "A package for meta-analysis of studies with complex knowledge and unexplained heterogeneity"
readme = "README.md"
requires-python = ">=3.12"

authors = [
    { name = "Martin Adamcik", email = "maths38@gmail.com" }
]

dependencies = [
    "numpy",
    "scipy",
]

license = { text = "GPL-3.0-or-later" }

classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
]


[project.scripts]
meta-analysis = "meta_analysis.meta_analysis:main"


[project.urls]
Homepage = "https://github.com/maths38/meta-analysis_package"


[tool.setuptools.packages.find]
where = ["."]
